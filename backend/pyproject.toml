[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-law-backend"
version = "0.1.0"
description = "Chat orchestrator over Gmail, Calendar and Drive"
requires-python = ">=3.12,<3.13"

dependencies = [
    # web
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.36",
    "httpx>=0.27,<0.29",

    # data
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3.2,<0.5",

    # models and settings
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "jsonschema>=4.23,<5.0",
    # pydantic EmailStr needs it; sign-up validates an address before
    # sending a code to it.
    "email-validator>=2.0,<3.0",

    # queue and cache
    "redis>=5.0,<6.0",
    "celery[redis]>=5.4,<6.0",

    # llm
    # One SDK per provider. Both are imported lazily — app/llm/router.py only
    # imports a provider module when a model string names that provider — so an
    # OpenAI-only deployment never loads the Anthropic client and never needs a
    # key for it. See docs/MODELS.md.
    "openai>=1.40,<2.0",
    "anthropic>=0.125,<1.0",
    # Gemini. The adapter builds the documented REST body either way and will
    # send it over httpx if this import fails, so the app still works without
    # it — this just gets the SDK path, which GEMINI_TRANSPORT can pin.
    "google-genai>=1.0,<2.0",

    # google
    "google-api-python-client>=2.140,<3.0",
    "google-auth>=2.33,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",

    # everything else
    "structlog>=24.4,<26.0",
    "python-dateutil>=2.9,<3.0",
    "nanoid>=2.0,<3.0",
    "cryptography>=43.0",
    "itsdangerous>=2.2,<3.0",
    "pypdf>=4.3,<6.0",
    "tenacity>=9.0,<10.0",

    # tests ship with the image so `make test` works in the container
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.2",
    "respx>=0.21,<0.23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2.0",
    "pytest-cov>=5.0",
    "types-python-dateutil>=2.9",
    "watchfiles>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:google.*"]
markers = [
    "integration: needs a live postgres or redis",
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # the formatter owns line length
    "B008",   # FastAPI Depends() in defaults is the idiom
    "N818",   # AppError, not AppErrorError
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"tests/*" = ["N802", "N806"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["alembic/versions/"]
