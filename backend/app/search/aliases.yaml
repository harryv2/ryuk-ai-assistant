# Vendor aliases.
#
# One entry per brand a person names in a chat box but never spells the way it
# appears in their mailbox. "Turkish Airlines" is the headline case: the subject
# line says THY, the sender is thy.com, the ticket says TK1984, and the Turkish
# original says Türk Hava Yolları. All five are the same thing.
#
# Fields
#   canonical       what a person would recognise; shown back to them
#   kind            airline | vendor | hotel | rail | logistics
#   tokens          every surface form, lower case. Matched on word boundaries,
#                   so a two-letter token like "tk" is safe.
#   sender_domains  an exact From: domain here is EXACT_SENDER evidence
#   code_patterns   regexes for the codes this brand puts in subjects
#
# Format note: this file is parsed by app/search/aliases.py, which uses PyYAML
# when it is importable and falls back to a small parser for exactly the subset
# used here — nested maps and lists of scalars, two-space indentation, no flow
# syntax, no multi-line strings. Keep new entries in the same shape.

version: 1

groups:

  turkish_airlines:
    canonical: Turkish Airlines
    kind: airline
    tokens:
      - turkish airlines
      - turkish airline
      - turkish air
      - turk hava yollari
      - "türk hava yolları"
      - "türk hava yolları a.o."
      - thy
      - tk
      - turkishairlines
    sender_domains:
      - turkishairlines.com
      - thy.com
      - mail.turkishairlines.com
    code_patterns:
      - '\bTK\s?\d{1,4}\b'

