<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Ask across Gmail, Calendar and Drive. Watch the plan run, and approve anything that changes."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 11h16M8 16h11M8 21h7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='21' r='3' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <title>Ryuk — AI Assistant</title>
    <script>
      // Paint the right theme before React mounts, so a dark-mode user never
      // sees a white flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* private mode: fall through to light */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
